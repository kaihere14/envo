name: release

# Two ways to cut a release:
#   git tag v0.1.0 && git push origin v0.1.0     — tag first, then build it
#   Run this workflow from main with `version` set — tags the current commit
#
# Running it from main with `version` empty builds every platform without
# publishing, so the packaging scripts can be exercised first.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release as this version, e.g. v0.1.0-beta.1 (leave empty to build only)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide whether the others built.
      fail-fast: false
      matrix:
        include:
          # Built on the oldest supported image so the binary does not
          # require a newer glibc than the user's distro ships.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            build: bash build/linux/build.sh x86_64-unknown-linux-gnu

          # Both macOS builds run on an Apple Silicon runner: Apple's
          # toolchain cross-compiles between macOS architectures natively, and
          # the Intel runner labels (macos-13) have been retired — a job
          # requesting one queues forever instead of failing.
          - os: macos-latest
            target: x86_64-apple-darwin
            build: bash build/macos/build.sh x86_64-apple-darwin

          - os: macos-latest
            target: aarch64-apple-darwin
            build: bash build/macos/build.sh aarch64-apple-darwin

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            build: pwsh -File build/windows/build.ps1 -Target x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build and package
        shell: bash
        run: ${{ matrix.build }}

      - uses: actions/upload-artifact@v5
        with:
          name: envo-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    # Publishes for a pushed tag, or for a manual run that named a version.
    # A manual run with no version stops after the build job.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: dist
          # Flatten every platform's artifacts into one dist/ directory, so
          # the asset names match what install.sh asks for.
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # A manual run names its own version; a tag push takes the tag it
          # was triggered by.
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail

          # Run from main, the tag does not exist yet — `gh release create`
          # creates it against this commit. Re-running for a version that was
          # already released replaces the assets instead of failing.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/* --clobber
          else
            gh release create "$VERSION" dist/* \
              --target "$GITHUB_SHA" \
              --title "$VERSION" \
              --generate-notes
          fi
